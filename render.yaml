# Render.com blueprint — https://render.com/docs/blueprint-spec
# In the Render dashboard: New -> Blueprint -> point at this repo, it will read this file.
#
# After the first deploy, go to Render -> this service -> Environment, and add
# TURSO_DATABASE_URL and TURSO_AUTH_TOKEN (see DEPLOY.md) so tenant data
# persists across redeploys. Without them the app falls back to a local
# SQLite file that resets whenever the free-tier instance restarts.
services:
  - type: web
    name: pg-rent-manager-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"   # replace with your deployed frontend URL once you have it
